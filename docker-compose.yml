services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fluig
      POSTGRES_PASSWORD: fluig
      POSTGRES_DB: fluig_support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluig -d fluig_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fluig:fluig@db:5432/fluig_support
      VECTOR_STORE: pgvector
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
